server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: bank-custody-workflow-demo

  # ========== MySQL 数据源 ==========
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bank_custody_demo}?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER: custody}
    password: ${DB_PASSWORD:custody123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  # ========== Flowable BPMN 工作流 ==========
  flowable:
    # 自动建表（23 张 ACT_* 表）
    database-schema-update: true
    # 自动部署 processes/ 下的 BPMN 文件
    async-executor-activate: true
    # 历史级别: full (审计用) / audit / activity
    history-level: full

# ========== MyBatis-Plus ==========
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.demo.custody: DEBUG
    org.flowable: INFO
