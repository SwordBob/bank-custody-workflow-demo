server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: bank-custody-workflow-demo

  # ========== MySQL 9.7.0 (用户本机) ==========
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/bank_custody_demo?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useServerPrepStmts=false&connectionCollation=utf8mb4_unicode_ci
    username: custody
    password: custody123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  # ========== Schema 初始化 (业务表) ==========
  # Flowable 自动建 23 张 ACT_* 表, 这里建 5 张业务表 + 种子数据
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false

  # ========== Flowable BPMN 工作流 ==========
  flowable:
    # 自动建表（23 张 ACT_* 表）
    database-schema-update: true
    # 自动部署 processes/ 下的 BPMN 文件
    async-executor-activate: true
    # 历史级别: full (审计用) / audit / activity
    history-level: full

# ========== MyBatis-Plus ==========
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.demo.custody: DEBUG
    org.flowable: INFO
    org.springframework.jdbc.datasource.init: WARN
