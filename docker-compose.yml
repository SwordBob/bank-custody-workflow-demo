# docker-compose.yml
# 银行资产托管 4 流程 demo —— 一键启动 MySQL + Spring Boot
# 用法: docker-compose up -d

version: '3.8'

services:
  # ========== MySQL 8 (银行资管业务库) ==========
  mysql:
    image: mysql:8.0
    container_name: bank-custody-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: bank_custody_demo
      MYSQL_USER: custody
      MYSQL_PASSWORD: custody123
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ========== Spring Boot 应用 ==========
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank-custody-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bank_custody_demo?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: custody
      SPRING_DATASOURCE_PASSWORD: custody123
      TZ: Asia/Shanghai
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/custody/health"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
